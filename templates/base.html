<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Меню бару</title>
  <meta name="description" content="Меню бару. Коктейлі, міцні напої та лікери.">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20y=%220%22%20width=%22100%22%20height=%22100%22><text y=%22.9em%22 font-size=%2290%22>🍸</text></svg>">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/newspaper.css') }}?v={{ cache_bust }}">
  {% block extra_head %}{% endblock %}
</head>
<body>

  <div class="newspaper-wrapper" style="padding-top: 24px;">
    
    <!-- Clean Minimal Header -->
    <header style="text-align: center; margin-bottom: 20px;">
      <h1 style="font-family: var(--font-masthead); font-size: 2.6rem; letter-spacing: 4px; text-transform: uppercase; margin: 0; padding-bottom: 8px;">
        МЕНЮ
      </h1>
      <hr style="border: none; border-top: 2px solid var(--ink-black); margin: 8px 0 16px;">
    </header>

    <!-- Main Content Area (Menu) -->
    <main>
      {% block content %}{% endblock %}
    </main>

    <!-- Minimal Footer -->
    <footer style="margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border-sepia); display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-muted);">
      <div>© Бар</div>
      <div>
        {% if is_local %}
          {% if is_admin %}
            <a href="{{ url_for('admin_dashboard') }}" class="admin-link">⚙ Адмінка</a> | 
            <a href="{{ url_for('admin_logout') }}" class="admin-link">Вийти</a>
          {% else %}
            <a href="{{ url_for('admin_login') }}" class="admin-link">🔒 Адмінка</a>
          {% endif %}
        {% endif %}
      </div>
    </footer>

  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
