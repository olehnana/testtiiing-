{% extends 'base.html' %}

{% block content %}

<div
  style="max-width: 480px; margin: 40px auto; background: var(--bg-paper-light); border: 2px solid var(--ink-black); padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
  <div style="text-align: center; margin-bottom: 24px;">
    <div style="margin-bottom: 12px;">
      <svg class="svg-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color: var(--ink-dark);"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    <h2 style="font-family: var(--font-masthead); font-size: 1.6rem; text-transform: uppercase; margin-bottom: 6px;">
      Кабінет Редактора</h2>
    <p style="font-family: var(--font-headline); font-style: italic; color: var(--ink-muted);">Введіть секретний шифр
      для керування наявністю напоїв</p>
  </div>

  {% if error %}
  <div
    style="background-color: #ffebee; border: 1px solid var(--stamp-red); color: var(--stamp-red); padding: 10px 14px; margin-bottom: 20px; font-family: var(--font-mono); font-size: 0.9rem;">
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="{{ url_for('admin_login') }}">
    <div class="form-group" style="margin-bottom: 20px;">
      <label for="password"
        style="display: block; font-family: var(--font-headline); font-weight: bold; margin-bottom: 8px;">Секретний
        пароль:</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Введіть пароль..." required
        autofocus style="font-size: 1.1rem; letter-spacing: 2px;">
    </div>

    <div style="display: flex; gap: 12px; margin-top: 24px;">
      <button type="submit" class="btn-antique" style="flex: 1; justify-content: center; padding: 12px;">Увійти до
        редакції</button>
      <a href="{{ url_for('index') }}" class="btn-antique"
        style="background: transparent; border-color: var(--border-sepia);">Назад до шпальт</a>
    </div>
  </form>
</div>

{% endblock %}
