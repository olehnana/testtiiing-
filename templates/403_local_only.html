{% extends 'base.html' %}

{% block content %}

<div style="max-width: 500px; margin: 50px auto; background: var(--bg-paper-light); border: 2px solid var(--stamp-red); padding: 32px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
  <div style="font-size: 2.8rem; margin-bottom: 12px;">🚫</div>
  <h2 style="font-family: var(--font-masthead); font-size: 1.5rem; text-transform: uppercase; color: var(--stamp-red); margin-bottom: 12px;">
    Доступ обмежено
  </h2>
  <p style="font-family: var(--font-body); font-size: 1.05rem; line-height: 1.5; color: var(--ink-dark); margin-bottom: 20px;">
    Панель керування закладом недоступна з публічного інтернету. Вхід дозволено виключно через внутрішню мережу закладу за локальною IP-адресою.
  </p>
  <a href="{{ url_for('index') }}" class="btn-antique" style="text-decoration: none; padding: 10px 20px;">
    Повернутися до меню
  </a>
</div>

{% endblock %}
